# Re-detect only AG→Manual heavy outliers (Tools already excluded from scoring).
# Uses instruction manual threshold 0.70. Same output_root as full corpus so
# QC merges; delete per-id detect/assign/eval/seq before running.

data_dir: "/home/ifab-agiprobotw-0001/KHETRE/Tobii_Data"
output_root: "outputs/batch_sam3_dense"

stages:
  - detect
  - assign
  - evaluate
  - sequences

skip_if_done: false
continue_on_error: true

recordings:
  - id: KJ03JM25_06
    tsv: KJ03JM25_06_data_export.tsv
    video: KJ03JM25_06_scenevideo.mp4
