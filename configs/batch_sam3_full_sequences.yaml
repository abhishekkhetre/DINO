# Full-recording dense SAM3 batch — primary goal: gaze-on-object sequences.
# No 30–60s trim: clip.mode=full uses the Eye Tracker timestamp span.
# stride=5 keeps GPU cost manageable for an initial full-video pass.
# After batch: python -m gaze_objects.cli aggregate-sequences --output-root outputs/batch_sam3_full

data_dir: "/home/ifab-agiprobotw-0001/KHETRE/Tobii_Data"
output_root: "outputs/batch_sam3_full"

stages:
  - detect
  - assign
  - evaluate
  - sequences

skip_if_done: true
continue_on_error: true

recordings:
  - id: AM07AM07_01
    tsv: AM07AM07_01_data_export.tsv
    video: AM07AM07_01_scenevideo.mp4

select:
  mode: all

defaults:
  timestamp_unit: milliseconds
  timestamp_unit_status: verified
  video_start_recording_s: 0.0
  time_mapping_status: verified
  max_abs_residual_s: 0.05
  compute_hash: false

  clip:
    mode: full

  frame_selection:
    mode: unique_matched_frames
    stride: 5
    # no max_frames cap — process the full matched-frame set (after stride)

  detector:
    backend: sam3
    device: cuda
    score_threshold: 0.55
    score_threshold_by_concept:
      angle grinder: 0.25
      grinder: 0.25
      electric grinder: 0.25
      disk grinder: 0.25
      instruction manual: 0.70
    load_from_hf: true
    text_concepts_file: "metaSAM3/prompts_assembly_aoi.txt"
    class_map_file: "configs/class_definitions.yaml"
    resolution: 1008

  assignment:
    score_threshold: 0.25
    overlap_policy: ambiguous
    require_normalized_label: false
    prefer_nested_parent: true
    nested_parent_expand_px: 80

  evaluation:
    ignore_reference_labels:
      - Tools

  sequences:
    movement_type: Fixation
    label_policy: assigned_majority
    min_assigned_samples: 2
    min_label_fraction: 0.5
