# Full-recording SAM3 batch — fine object labels (approach 2).
# Sequences use SAM3 object names (screwdriver, angle grinder, …), not Tobii AOIs.
# clip.mode=full; stride=5; no max_frames.
# After batch:
#   python -m gaze_objects.cli aggregate-sequences --output-root outputs/batch_sam3_full_fine

data_dir: "/home/ifab-agiprobotw-0001/KHETRE/Tobii_Data"
output_root: "outputs/batch_sam3_full_fine"

stages:
  - detect
  - assign
  - sequences

skip_if_done: true
continue_on_error: true

recordings:
  - id: AM07AM07_01
    tsv: AM07AM07_01_data_export.tsv
    video: AM07AM07_01_scenevideo.mp4

select:
  mode: all

defaults:
  timestamp_unit: milliseconds
  timestamp_unit_status: verified
  video_start_recording_s: 0.0
  time_mapping_status: verified
  max_abs_residual_s: 0.05
  compute_hash: false

  clip:
    mode: full

  frame_selection:
    mode: unique_matched_frames
    stride: 5

  detector:
    backend: sam3
    device: cuda
    label_map_mode: fine
    score_threshold: 0.50
    score_threshold_by_concept:
      angle grinder: 0.25
      grinder: 0.25
      electric grinder: 0.25
      grinding disc: 0.40
      cutting disc: 0.40
      instruction manual: 0.55
      screwdriver: 0.45
      wrench: 0.45
      pliers: 0.45
      hex key: 0.45
      hammer: 0.45
      storage box: 0.45
    load_from_hf: true
    text_concepts_file: "metaSAM3/prompts_fine_objects.txt"
    class_map_file: "configs/class_definitions.yaml"
    resolution: 1008

  assignment:
    score_threshold: 0.25
    overlap_policy: ambiguous
    require_normalized_label: false
    # Do NOT collapse tools under angle grinder — fine sequences need tool names.
    prefer_nested_parent: false
    label_map_mode: fine

  sequences:
    movement_type: Fixation
    label_policy: assigned_majority
    min_assigned_samples: 2
    min_label_fraction: 0.5
