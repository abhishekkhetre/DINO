# Smoke batch: up to 5 Tobii recordings with dense SAM3 + Stage E gates.
# data_dir: full Tobii corpus (TSV + scene videos; nested folders OK).
# AM07 is preferred first when present; remaining slots filled by discover until 5.

data_dir: "/home/ifab-agiprobotw-0001/KHETRE/Tobii_Data"
output_root: "outputs/batch_sam3_dense_5"

stages:
  - detect
  - assign
  - evaluate
  - sequences

skip_if_done: true
continue_on_error: true

# Prefer known AM07 first; discover fills up to n=5.
recordings:
  - id: AM07AM07_01
    tsv: AM07AM07_01_data_export.tsv
    video: AM07AM07_01_scenevideo.mp4

select:
  mode: first_n
  n: 5

defaults:
  timestamp_unit: milliseconds
  timestamp_unit_status: verified
  video_start_recording_s: 0.0
  time_mapping_status: verified
  max_abs_residual_s: 0.05
  compute_hash: true

  clip:
    recording_start_s: 30.0
    recording_end_s: 60.0

  frame_selection:
    mode: unique_matched_frames
    stride: 2
    max_frames: 150

  detector:
    backend: sam3
    device: cuda
    score_threshold: 0.55
    score_threshold_by_concept:
      angle grinder: 0.25
      grinder: 0.25
      electric grinder: 0.25
      disk grinder: 0.25
    load_from_hf: true
    text_concepts_file: "metaSAM3/prompts_pilot_concepts.txt"
    class_map_file: "configs/class_definitions.yaml"
    resolution: 1008

  assignment:
    score_threshold: 0.25
    overlap_policy: ambiguous
    require_normalized_label: false

  sequences:
    movement_type: Fixation
    label_policy: assigned_majority
    min_assigned_samples: 2
    min_label_fraction: 0.5
