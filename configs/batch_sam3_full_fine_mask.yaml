# Full Tobii corpus — FRESH mask pipeline + fine/part CSV labels (NO overlay video).
# Stages: detect → assign (mask + tip/handle/body) → sequences
# NEW output root (do not reuse box-era batch_sam3_full_fine).
#
# Start:
#   bash scripts/run_batch_mask_csv.sh
# After:
#   python -m gaze_objects.cli aggregate-sequences --output-root outputs/batch_sam3_full_fine_mask

data_dir: "/home/ifab-agiprobotw-0001/KHETRE/Tobii_Data"
output_root: "outputs/batch_sam3_full_fine_mask"

stages:
  - detect
  - assign
  - sequences

skip_if_done: true
continue_on_error: true

recordings:
  - id: AM07AM07_01
    tsv: AM07AM07_01_data_export.tsv
    video: AM07AM07_01_scenevideo.mp4

select:
  mode: all

defaults:
  timestamp_unit: milliseconds
  timestamp_unit_status: verified
  video_start_recording_s: 0.0
  time_mapping_status: verified
  max_abs_residual_s: 0.05
  compute_hash: false

  clip:
    mode: full

  frame_selection:
    mode: unique_matched_frames
    stride: 8

  detector:
    backend: sam3
    device: cuda
    label_map_mode: fine
    resolution: 1008
    enable_segmentation: true
    keep_masks: true
    min_free_vram_gib: 6.0
    score_threshold: 0.50
    score_threshold_by_concept:
      angle grinder: 0.18
      electric grinder: 0.28
      power tool: 0.25
      instruction manual: 0.60
      screwdriver: 0.48
      wrench: 0.50
      storage box: 0.45
    min_box_area_frac_by_concept:
      angle grinder: 0.010
    load_from_hf: true
    text_concepts_file: "metaSAM3/prompts_fine_objects.txt"
    class_map_file: "configs/class_definitions.yaml"

  assignment:
    hit_test: mask
    score_threshold: 0.18
    overlap_policy: ambiguous
    require_normalized_label: false
    prefer_nested_parent: false
    prefer_smallest_containing: false
    label_map_mode: fine
    part_geometry: true
    part_objects:
      - screwdriver
      - wrench
      - angle grinder

  sequences:
    movement_type: Fixation
    label_policy: part_majority
    min_assigned_samples: 2
    min_label_fraction: 0.5
